# DO2603 starter: synchronous ingestion; worker is the mandatory Day 1 learner deliverable.
name: insighthub-do2603
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
    environment:
      POSTGRES_USER: insighthub
      POSTGRES_PASSWORD: insighthub
      POSTGRES_DB: insighthub
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insighthub -d insighthub"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 768m

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 256m

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://insighthub:insighthub@postgres:5432/insighthub
      REDIS_URL: redis://redis:6379/0
      RAG_MODE: ${RAG_MODE:-fixture}
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fixture}
      LLM_MODEL: ${LLM_MODEL:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-1024}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_CHAT_MODEL: ${GEMINI_CHAT_MODEL:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_CHAT_MODEL: ${ANTHROPIC_CHAT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-3.5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_CHAT_MODEL: ${OLLAMA_CHAT_MODEL:-}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-60}
      LLM_INPUT_COST_USD_PER_MILLION_TOKENS: ${LLM_INPUT_COST_USD_PER_MILLION_TOKENS:-0}
      LLM_OUTPUT_COST_USD_PER_MILLION_TOKENS: ${LLM_OUTPUT_COST_USD_PER_MILLION_TOKENS:-0}
      EMBEDDING_COST_USD_PER_MILLION_TOKENS: ${EMBEDDING_COST_USD_PER_MILLION_TOKENS:-0}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g

  ingestion-worker:
    build: ./api
    environment:
      DATABASE_URL: postgresql://insighthub:insighthub@postgres:5432/insighthub
      REDIS_URL: redis://redis:6379/0
      WORKER_METRICS_PORT: 8001
      RAG_MODE: ${RAG_MODE:-fixture}
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fixture}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1024}
      EMBEDDING_REVISION: ${EMBEDDING_REVISION:-1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_EMBEDDING_MODEL: ${GEMINI_EMBEDDING_MODEL:-gemini-embedding-2}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      VOYAGE_EMBEDDING_MODEL: ${VOYAGE_EMBEDDING_MODEL:-voyage-3.5}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-mxbai-embed-large}
      PROVIDER_TIMEOUT_SECONDS: ${PROVIDER_TIMEOUT_SECONDS:-60}
      LLM_INPUT_COST_USD_PER_MILLION_TOKENS: ${LLM_INPUT_COST_USD_PER_MILLION_TOKENS:-0}
      LLM_OUTPUT_COST_USD_PER_MILLION_TOKENS: ${LLM_OUTPUT_COST_USD_PER_MILLION_TOKENS:-0}
      EMBEDDING_COST_USD_PER_MILLION_TOKENS: ${EMBEDDING_COST_USD_PER_MILLION_TOKENS:-0}
    command: arq app.worker.WorkerSettings
    # The shared API image exposes an HTTP healthcheck, but the ARQ worker does
    # not serve HTTP. Verify the actual worker process instead.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if any('arq app.worker.WorkerSettings' in open('/proc/'+p+'/cmdline','rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit()) else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    mem_limit: 1g

  web:
    build: ./web
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 512m

  chatops-bot:
    build: ./chatops-bot
    profiles: ["chatops"]
    environment:
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_BOT_USER_ID: ${SLACK_BOT_USER_ID:-}
      REDIS_URL: redis://redis:6379/1
      INSIGHTHUB_API_URL: http://api:8000
      MCP_KUBERNETES_URL: ${MCP_KUBERNETES_URL:-http://host.docker.internal:18081/mcp}
      MCP_PROMETHEUS_URL: ${MCP_PROMETHEUS_URL:-http://host.docker.internal:18082/mcp}
    ports:
      - "127.0.0.1:${CHATOPS_PORT:-8080}:8080"
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m

  chatops-worker:
    build: ./chatops-bot
    profiles: ["chatops"]
    command: arq app.worker.WorkerSettings
    environment:
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      REDIS_URL: redis://redis:6379/1
      INSIGHTHUB_API_URL: http://api:8000
      MCP_KUBERNETES_URL: ${MCP_KUBERNETES_URL:-http://host.docker.internal:18081/mcp}
      MCP_PROMETHEUS_URL: ${MCP_PROMETHEUS_URL:-http://host.docker.internal:18082/mcp}
      CHATOPS_AUDIT_LOG_PATH: ${CHATOPS_AUDIT_LOG_PATH:-/app/audit/chatops-audit.log}
      CHATOPS_MUTATOR_URL: ${CHATOPS_MUTATOR_URL:-http://host.docker.internal:18083/v1/actions/scale-api}
      CHATOPS_MUTATION_SIGNING_SECRET: ${CHATOPS_MUTATION_SIGNING_SECRET:-}
    volumes:
      - chatops-audit:/app/audit
    depends_on:
      redis:
        condition: service_healthy
    # The image healthcheck targets the HTTP bot; this service is an ARQ process.
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if any('arq app.worker.WorkerSettings' in open('/proc/'+p+'/cmdline','rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit()) else 1)"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    mem_limit: 256m

  ollama:
    image: ollama/ollama:0.33.3@sha256:32931b46719f673c05fdbaa81ccb26da18ea4a1c57590a754874ab28ba269eb2
    profiles: ["ollama"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 10
    # CPU container is optional. On macOS prefer native Ollama for Metal.

  prometheus:
    image: prom/prometheus:v3.7.3
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    volumes:
      - ./tools/mcp/day2/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.0.2
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./tools/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./tools/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:3000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped


volumes:
  pgdata:
  ollama-data:
  chatops-audit:
