# Local Day 6 gateway configuration. Secrets are supplied through environment.
model_list:
  - model_name: qwen2.5:3b
    litellm_params:
      model: ollama/qwen2.5:3b
      api_base: os.environ/OLLAMA_BASE_URL
  - model_name: mxbai-embed-large
    litellm_params:
      model: ollama/mxbai-embed-large
      api_base: os.environ/OLLAMA_BASE_URL

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

litellm_settings:
  drop_params: true
  callbacks:
    - prometheus
  # The gateway is bound to localhost in the local lab; Prometheus needs to
  # scrape cost/usage metrics without exposing the admin key to the scraper.
  require_auth_for_metrics_endpoint: false
