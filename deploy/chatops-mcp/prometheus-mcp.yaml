apiVersion: v1
kind: ServiceAccount
metadata:
  name: chatops-prometheus-mcp
  namespace: insighthub
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-prometheus-mcp
  namespace: insighthub
  labels:
    app.kubernetes.io/name: chatops-prometheus-mcp
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chatops-prometheus-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatops-prometheus-mcp
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: chatops-prometheus-mcp
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus-mcp
          image: ghcr.io/tjhop/prometheus-mcp-server:v0.18.0@sha256:f36084c0b510b8cfb43e03cdaaa83011f3618884b37a4ffe89a46f6241ada0fc
          imagePullPolicy: IfNotPresent
          args:
            - --prometheus.url=http://kube-prometheus-stack-prometheus.monitoring.svc:9090
            - --mcp.transport=http
            - --web.listen-address=:8080
          ports:
            - name: mcp
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: chatops-prometheus-mcp
  namespace: insighthub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chatops-prometheus-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
