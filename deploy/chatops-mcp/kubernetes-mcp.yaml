apiVersion: v1
kind: ConfigMap
metadata:
  name: chatops-kubernetes-mcp-config
  namespace: insighthub
data:
  config.toml: |
    port = "8080"
    bind_address = "0.0.0.0"
    stateless = true
    read_only = true
    cluster_provider_strategy = "in-cluster"
    toolsets = ["core"]
    # The ChatOps worker needs one fixed read-only operation. Do not expose a
    # general Kubernetes command surface through this local MCP endpoint.
    enabled_tools = ["pods_list_in_namespace"]
    list_output = "table"

    [[denied_resources]]
    group = ""
    version = "v1"
    kind = "Secret"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: chatops-kubernetes-mcp
  namespace: insighthub
  labels:
    app.kubernetes.io/name: chatops-kubernetes-mcp
    app.kubernetes.io/component: mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: chatops-kubernetes-mcp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatops-kubernetes-mcp
        app.kubernetes.io/component: mcp
    spec:
      serviceAccountName: mcp-readonly
      automountServiceAccountToken: true
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: kubernetes-mcp
          image: quay.io/containers/kubernetes_mcp_server:v0.0.66@sha256:6d650f4bd6ac303ad82713c997e73a2d001602f9bf17392c9b9a0e30e29c6423
          imagePullPolicy: IfNotPresent
          env:
            - name: MCP_CONFIG_PATH
              value: /etc/kubernetes-mcp-server/config.toml
          ports:
            - name: mcp
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: mcp
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: chatops-kubernetes-mcp-config
---
apiVersion: v1
kind: Service
metadata:
  name: chatops-kubernetes-mcp
  namespace: insighthub
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: chatops-kubernetes-mcp
  ports:
    - name: mcp
      port: 8080
      targetPort: mcp
