global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "insighthub-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8000"

  - job_name: "insighthub-worker"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:8001"

  - job_name: "litellm"
    metrics_path: /metrics/
    static_configs:
      - targets:
          - "host.docker.internal:4000"
