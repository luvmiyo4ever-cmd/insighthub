name: InsightHub Day 03 CI and reviewed cloud plan/apply

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      cloud_ready:
        description: "Explicitly confirm all cloud inputs and approvals are present"
        required: true
        type: boolean
        default: false
      aws_region:
        description: "Reviewed AWS region; must equal the protected AWS_REGION variable"
        required: true
        type: string
      state_bucket:
        description: "Existing private bootstrap state bucket"
        required: true
        type: string
      state_key:
        description: "Reviewed platform state key"
        required: true
        type: string
      budget_usd:
        description: "Maximum approved monthly estimate for this lab"
        required: true
        type: string
      pull_request_number:
        description: "Optional PR number for the sanitized Infracost/review comment"
        required: false
        type: string

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.15.8"
  TFLINT_VERSION: "0.64.0"
  CHECKOV_VERSION: "3.3.19"
  CONFTEST_VERSION: "0.69.0"
  INFRACOST_VERSION: "0.10.43"

jobs:
  workflow-contract:
    name: Workflow contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.12"
      - name: Validate workflow safety contracts
        run: python scripts/ci/validate_workflow_contract.py

  fmt-lint:
    name: Terraform fmt, validate, and TFLint
    needs: workflow-contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Install pinned TFLint release
        shell: bash
        run: |
          set -euo pipefail
          asset="tflint_linux_amd64.zip"
          api="https://api.github.com/repos/terraform-linters/tflint/releases/tags/v${TFLINT_VERSION}"
          url="$(curl --fail --silent --show-error --location "$api" | jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url')"
          digest="$(curl --fail --silent --show-error --location "$api" | jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' | sed 's/^sha256://')"
          test -n "$url" -a -n "$digest"
          curl --fail --silent --show-error --location "$url" --output /tmp/tflint.zip
          echo "$digest  /tmp/tflint.zip" | sha256sum --check
          unzip -q /tmp/tflint.zip -d /tmp/tflint
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/tflint/tflint "$HOME/.local/bin/tflint"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          tflint --version
      - name: Format and validate every Terraform root
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive infra
          for root in infra/bootstrap infra/platform; do
            terraform -chdir="$root" init -backend=false -input=false -no-color
            terraform -chdir="$root" validate -no-color
          done
          tflint --chdir=infra --recursive

  security-policy:
    name: Checkov and Conftest policy gates
    needs: fmt-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.12"
      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check --no-cache-dir "checkov==${CHECKOV_VERSION}"
      - name: Install and checksum pinned Conftest release
        shell: bash
        run: |
          set -euo pipefail
          asset="conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          api="https://api.github.com/repos/open-policy-agent/conftest/releases/tags/v${CONFTEST_VERSION}"
          url="$(curl --fail --silent --show-error --location "$api" | jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url')"
          digest="$(curl --fail --silent --show-error --location "$api" | jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' | sed 's/^sha256://')"
          test -n "$url" -a -n "$digest"
          curl --fail --silent --show-error --location "$url" --output /tmp/conftest.tar.gz
          echo "$digest  /tmp/conftest.tar.gz" | sha256sum --check
          tar -xzf /tmp/conftest.tar.gz -C /tmp
          mkdir -p "$HOME/.local/bin"
          install -m 0755 /tmp/conftest "$HOME/.local/bin/conftest"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          conftest --version
      - name: Run strict security scan
        run: checkov -d infra --framework terraform --quiet
      - name: Run positive policy fixture
        run: conftest test -p infra/policies infra/policies/tests/positive-plan.json
      - name: Assert negative policy fixture is denied
        shell: bash
        run: |
          set +e
          conftest test -p infra/policies infra/policies/tests/negative-plan.json
          status=$?
          set -e
          test "$status" -eq 1

  application-tests:
    name: Day 01 application tests
    needs: security-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: insighthub-ci
      RAG_MODE: fixture
      LLM_PROVIDER: fixture
      EMBEDDING_PROVIDER: fixture
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12.12"
      - name: Build and start local fixture
        run: docker compose up --build -d --wait
      - name: Run application contract tests
        run: |
          python3 scripts/verify.py setup
          python3 scripts/verify.py smoke --json
      - name: Teardown local fixture
        if: always()
        run: docker compose --profile ollama down --volumes --remove-orphans

  image-build:
    name: Build application images without push
    needs: application-tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Build API image
        run: docker build --pull=false -f api/Dockerfile -t insighthub/api:ci-${GITHUB_SHA} api
      - name: Build worker image
        run: docker build --pull=false -f api/Dockerfile -t insighthub/worker:ci-${GITHUB_SHA} api
      - name: Build web image
        run: docker build --pull=false -f web/Dockerfile -t insighthub/web:ci-${GITHUB_SHA} web
      - name: Record source-bound image metadata
        run: |
          docker image inspect insighthub/api:ci-${GITHUB_SHA} insighthub/worker:ci-${GITHUB_SHA} insighthub/web:ci-${GITHUB_SHA} \
            --format '{{json .RepoDigests}}' > image-source-binding.json
          printf '%s\n' "source_sha=${GITHUB_SHA}" >> image-source-binding.json

  preflight:
    name: Cloud input preflight
    needs: image-build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: check
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.cloud_ready }}" = true
          test "${{ github.event.repository.fork }}" != true
          test "${{ github.ref }}" = refs/heads/main
          test "${{ github.event.repository.visibility }}" = private
          [[ "${{ inputs.state_bucket }}" =~ ^[a-z0-9][a-z0-9.-]{2,62}$ ]]
          test -n "${{ inputs.state_key }}" -a "${{ inputs.state_key }}" != "terraform.tfstate"
          awk 'BEGIN { if (ARGV[1] <= 0) exit 1 }' "${{ inputs.budget_usd }}"
          printf 'ready=true\n' >> "$GITHUB_OUTPUT"

  plan-review:
    name: Plan, cost, sanitized AI review, and source binding
    needs: preflight
    if: github.event_name == 'workflow_dispatch' && needs.preflight.outputs.ready == 'true' && github.repository == vars.CANONICAL_REPOSITORY
    runs-on: ubuntu-24.04
    environment: aws-plan
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    outputs:
      apply_allowed: ${{ steps.gate.outputs.apply_allowed }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Validate protected plan secrets
        env:
          CANONICAL_REPOSITORY: ${{ vars.CANONICAL_REPOSITORY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          PLAN_ROLE_ARN: ${{ vars.PLAN_ROLE_ARN }}
          APPLY_ROLE_ARN: ${{ vars.APPLY_ROLE_ARN }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          PLATFORM_TFVARS_B64: ${{ secrets.PLATFORM_TFVARS_B64 }}
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$CANONICAL_REPOSITORY"
          test -n "$AWS_REGION" -a "${{ inputs.aws_region }}" = "$AWS_REGION"
          test -n "$AWS_ACCOUNT_ID"
          test -n "$PLAN_ROLE_ARN" -a -n "$APPLY_ROLE_ARN"
          test "${PLAN_ROLE_ARN//\*/}" = "$PLAN_ROLE_ARN"
          test "${APPLY_ROLE_ARN//\*/}" = "$APPLY_ROLE_ARN"
          test "${PLAN_ROLE_ARN#arn:aws:iam::${AWS_ACCOUNT_ID}:role/}" != "$PLAN_ROLE_ARN"
          test "${APPLY_ROLE_ARN#arn:aws:iam::${AWS_ACCOUNT_ID}:role/}" != "$APPLY_ROLE_ARN"
          test -n "$OPENAI_MODEL"
          test -n "$PLATFORM_TFVARS_B64"
          test -n "$INFRACOST_API_KEY"
          test -n "$OPENAI_API_KEY"
      - name: Configure plan role through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.PLAN_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: insighthub-plan-${{ github.run_id }}
      - name: Write protected Terraform variables
        env:
          PLATFORM_TFVARS_B64: ${{ secrets.PLATFORM_TFVARS_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$PLATFORM_TFVARS_B64" | base64 --decode > infra/platform/terraform.tfvars
          chmod 600 infra/platform/terraform.tfvars
      - name: Initialize the reviewed S3 native-lockfile backend
        run: |
          terraform -chdir=infra/platform init -input=false -reconfigure -no-color \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=${{ inputs.state_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
      - name: Create the saved plan and checksum
        shell: bash
        run: |
          set +e
          terraform -chdir=infra/platform plan -input=false -no-color -detailed-exitcode \
            -var-file=terraform.tfvars -out="$GITHUB_WORKSPACE/platform.tfplan"
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 2
          terraform show -json "$GITHUB_WORKSPACE/platform.tfplan" > platform.plan.json
          sha256sum platform.tfplan > platform.tfplan.sha256
      - name: Install pinned Infracost release and verify digest
        shell: bash
        run: |
          set -euo pipefail
          asset="infracost-linux-amd64.tar.gz"
          api="https://api.github.com/repos/infracost/infracost/releases/tags/v${INFRACOST_VERSION}"
          url="$(curl --fail --silent --show-error --location "$api" | jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .browser_download_url')"
          digest="$(curl --fail --silent --show-error --location "$api" | jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest' | sed 's/^sha256://')"
          test -n "$url" -a -n "$digest"
          curl --fail --silent --show-error --location "$url" --output /tmp/infracost.tar.gz
          echo "$digest  /tmp/infracost.tar.gz" | sha256sum --check
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/infracost.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/infracost" --version
      - name: Generate Infracost estimate and sanitized review
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          set -euo pipefail
          infracost breakdown --path platform.plan.json --format json --out-file infracost.json
          python scripts/ci/sanitize_plan.py \
            --plan-json platform.plan.json \
            --cost-json infracost.json \
            --budget-usd "${{ inputs.budget_usd }}" \
            --summary-json plan-summary.json \
            --summary-md plan-summary.md
      - name: Explain only the sanitized plan with OpenAI Responses API
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
        run: python scripts/ci/ai_explain_sanitized_plan.py --summary plan-summary.json --output ai-plan-explanation.md
      - name: Build the human-review comment
        run: |
          cat plan-summary.md > plan-review-comment.md
          printf '\n## AI explanation of the sanitized plan\n\n' >> plan-review-comment.md
          cat ai-plan-explanation.md >> plan-review-comment.md
          printf '\n\nInfracost was calculated from the saved plan. Raw plan/state/credentials are not included.\n' >> plan-review-comment.md
      - name: Comment sanitized cost and risk review on the PR
        if: inputs.pull_request_number != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci/post_pr_comment.py --pull-request "${{ inputs.pull_request_number }}" --body plan-review-comment.md
      - id: gate
        name: Stop before apply on destroy, budget, or source uncertainty
        shell: bash
        run: |
          set -euo pipefail
          destroy_count="$(jq -r '.destroy_count' plan-summary.json)"
          budget_status="$(jq -r '.budget_status' plan-summary.json)"
          test "$destroy_count" -eq 0
          test "$budget_status" = within
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            '.repository == $repo and .source_sha == $sha and .human_review_required == true' \
            plan-summary.json
          printf 'apply_allowed=true\n' >> "$GITHUB_OUTPUT"
      - name: Bind source, plan checksum, and run identity
        run: |
          set -euo pipefail
          test "${{ github.event.repository.visibility }}" = private
          plan_sha="$(cut -d ' ' -f1 platform.tfplan.sha256)"
          jq -n \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg source_sha "$GITHUB_SHA" \
            --arg plan_sha "$plan_sha" \
            --arg run_id "$GITHUB_RUN_ID" \
            '{repository: $repository, source_sha: $source_sha, plan_sha256: $plan_sha, plan_run_id: $run_id, root: "infra/platform"}' \
            > source-binding.json
      - name: Upload private saved-plan artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: insighthub-reviewed-plan-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 1
          path: |
            platform.tfplan
            platform.tfplan.sha256
            source-binding.json
            plan-summary.json
            plan-summary.md
            ai-plan-explanation.md
            plan-review-comment.md

  apply:
    name: Apply exact reviewed plan
    needs: plan-review
    if: github.event_name == 'workflow_dispatch' && needs.plan-review.outputs.apply_allowed == 'true' && github.repository == vars.CANONICAL_REPOSITORY
    runs-on: ubuntu-24.04
    environment: aws-apply
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: insighthub-reviewed-plan-${{ github.run_id }}
          path: plan-artifact
      - name: Verify source binding and exact saved-plan checksum
        shell: bash
        run: |
          set -euo pipefail
          jq -e --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" --arg run "$GITHUB_RUN_ID" \
            '.repository == $repo and .source_sha == $sha and .plan_run_id == $run' \
            plan-artifact/source-binding.json
          (cd plan-artifact && sha256sum -c platform.tfplan.sha256)
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - name: Configure apply role through OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.APPLY_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
          role-session-name: insighthub-apply-${{ github.run_id }}
      - name: Write protected Terraform variables
        env:
          PLATFORM_TFVARS_B64: ${{ secrets.PLATFORM_TFVARS_B64 }}
        run: |
          set -euo pipefail
          printf '%s' "$PLATFORM_TFVARS_B64" | base64 --decode > infra/platform/terraform.tfvars
          chmod 600 infra/platform/terraform.tfvars
      - name: Initialize backend and apply only the verified saved plan
        run: |
          set -euo pipefail
          terraform -chdir=infra/platform init -input=false -reconfigure -no-color \
            -backend-config="bucket=${{ inputs.state_bucket }}" \
            -backend-config="key=${{ inputs.state_key }}" \
            -backend-config="region=${{ inputs.aws_region }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"
          terraform -chdir=infra/platform apply -input=false -no-color "$GITHUB_WORKSPACE/plan-artifact/platform.tfplan"
      - name: Remove protected variables from the runner workspace
        if: always()
        run: rm -f infra/platform/terraform.tfvars
