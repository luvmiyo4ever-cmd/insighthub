# Local Day 4 fixture traffic. This is a temporary Pod, not a Day 1 service.
apiVersion: v1
kind: Pod
metadata:
  name: insighthub-baseline-warmup
  namespace: insighthub
  labels:
    app.kubernetes.io/name: insighthub
    app.kubernetes.io/component: day4-baseline-warmup
spec:
  restartPolicy: Never
  containers:
    - name: curl
      image: curlimages/curl:8.12.1
      command:
        - sh
        - -ec
        - |
          deadline=$(( $(date +%s) + 3900 ))
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if ! curl --fail --silent --show-error \
              --request POST http://insighthub-api.insighthub.svc.cluster.local:8000/chat \
              --header 'Content-Type: application/json' \
              --data '{"question":"Day 4 baseline warm-up request"}' >/dev/null; then
              # API rollouts during a controlled incident are expected.
              # Retry next interval rather than terminating the 65-minute baseline.
              true
            fi
            sleep 10
          done
