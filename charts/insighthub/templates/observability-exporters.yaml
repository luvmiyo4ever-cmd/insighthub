{{- if .Values.observability.exporters.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insighthub.fullname" . }}-redis-exporter
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "insighthub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis-exporter
  template:
    metadata:
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis-exporter
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: redis-exporter
          image: {{ .Values.observability.exporters.redis.image | quote }}
          args: ["--redis.addr=$(REDIS_URL)"]
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.runtime.redisUrlSecret.name }}
                  key: {{ .Values.runtime.redisUrlSecret.key }}
          ports:
            - name: metrics
              containerPort: 9121
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.observability.exporters.redis.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighthub.fullname" . }}-redis-exporter
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis-exporter
spec:
  ports:
    - name: metrics
      port: 9121
      targetPort: metrics
  selector:
    {{- include "insighthub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis-exporter
{{- end }}
{{- if .Values.observability.exporters.postgres.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insighthub.fullname" . }}-postgres-exporter
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
