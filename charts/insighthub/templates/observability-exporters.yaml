            {{- toYaml .Values.observability.exporters.postgres.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighthub.fullname" . }}-postgres-exporter
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
spec:
  ports:
    - name: metrics
      port: 9187
      targetPort: metrics
