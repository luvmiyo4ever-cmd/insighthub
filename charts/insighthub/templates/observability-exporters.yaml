{{- if .Values.observability.exporters.blackbox.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "insighthub.fullname" . }}-blackbox
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox-exporter
data:
  blackbox.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          method: GET
          preferred_ip_protocol: ip4
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "insighthub.fullname" . }}-blackbox
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "insighthub.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: blackbox-exporter
  template:
    metadata:
      labels:
        {{- include "insighthub.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: blackbox-exporter
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: blackbox-exporter
          image: {{ .Values.observability.exporters.blackbox.image | quote }}
          args: ["--config.file=/config/blackbox.yml"]
          ports:
            - name: metrics
              containerPort: 9115
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.observability.exporters.blackbox.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "insighthub.fullname" . }}-blackbox
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "insighthub.fullname" . }}-blackbox
  labels:
    {{- include "insighthub.labels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox-exporter
spec:
  ports:
    - name: metrics
      port: 9115
      targetPort: metrics
  selector:
    {{- include "insighthub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: blackbox-exporter
{{- end }}
