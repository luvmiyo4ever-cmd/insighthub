# EKS-only overlay. Do not use this file for kind: its database and cache are
# external managed services and its Secrets Store CSI + IRSA prerequisites are
# intentionally absent from the local lab.
postgres:
  enabled: false

redis:
  enabled: false

secretsStore:
  enabled: true
  awsRegion: REPLACE_WITH_AWS_REGION
  awsSecretName: REPLACE_WITH_SECRETS_MANAGER_SECRET_NAME

# API and worker need different exact IRSA roles. The role ARNs are supplied
# only in the protected deployment values/environment, never in application
# source or a pull request.
serviceAccounts:
  api:
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_WITH_API_IRSA_ROLE_ARN
  worker:
    annotations:
      eks.amazonaws.com/role-arn: REPLACE_WITH_WORKER_IRSA_ROLE_ARN

# HTTPS/DNS/ALB are deferred by docs/day3/SPEC.md. An approved later-stage
# overlay may enable Ingress after it supplies a real hostname and TLS secret.
ingress:
  enabled: false
