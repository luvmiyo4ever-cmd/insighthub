nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  runAsGroup: 1001
  seccompProfile:
    type: RuntimeDefault

serviceAccounts:
  web:
    create: true
    annotations: {}
  api:
    create: true
    annotations: {}
  worker:
    create: true
    annotations: {}

runtime:
  ragMode: real
  llmProvider: gemini
  embeddingProvider: gemini
  llmModel: ""
  embeddingModel: ""
  embeddingDim: 1024
  embeddingRevision: "1"
  llmMaxTokens: 1024
  providerTimeoutSeconds: "60"
  workerMetricsPort: 8001
  # Optional unit prices for the estimated-cost metric. Keep 0 until an
  # operator deliberately supplies a reviewed price card.
  llmInputCostUsdPerMillionTokens: 0
  llmOutputCostUsdPerMillionTokens: 0
  embeddingCostUsdPerMillionTokens: 0
  chunkSize: 800
  chunkOverlap: 100
  retrievalTopK: 5
  databaseUrlSecret:
    name: insighthub-runtime-secrets
    key: DATABASE_URL
  redisUrlSecret:
    name: insighthub-runtime-secrets
    key: REDIS_URL

# Prometheus Operator resources are opt-in so the base chart remains usable in
# clusters that do not install the ServiceMonitor CRD. Set additionalLabels to
# the selector labels used by the installed Prometheus instance (for example,
# a release label from kube-prometheus-stack).
observability:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    prometheusNamespace: monitoring
    additionalLabels: {}
  rules:
    enabled: false
    namespace: monitoring
    # Must match the Prometheus ruleSelector (for kube-prometheus-stack,
    # normally the Helm release label).
    additionalLabels: {}
  exporters:
    redis:
      enabled: false
      image: oliver006/redis_exporter:v1.77.0-alpine
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi
    postgres:
      enabled: false
      image: quay.io/prometheuscommunity/postgres-exporter:v0.20.1
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          cpu: 150m
          memory: 192Mi
    blackbox:
      enabled: false
      image: quay.io/prometheus/blackbox-exporter:v0.28.0
      resources:
        requests:
          cpu: 25m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 128Mi

postgres:
  enabled: false
  image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
  imagePullPolicy: IfNotPresent
  servicePort: 5432
  storage:
    size: 2Gi
    storageClassName: ""
  auth:
    existingSecret: insighthub-runtime-secrets
    passwordKey: POSTGRES_PASSWORD
  # The upstream PostgreSQL entrypoint initializes its data directory before
  # switching to the database user. Keep this local-only exception scoped to
  # the StatefulSet; app workloads always run as UID/GID 1001.
  podSecurityContext:
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

redis:
  enabled: false
  image: redis:7-alpine
  servicePort: 6379
  storage:
    size: 1Gi
    storageClassName: ""
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

api:
  replicaCount: 1
  image:
    repository: insighthub/api
    tag: kind
    pullPolicy: IfNotPresent
  service:
    port: 8000
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

worker:
  replicaCount: 1
  image:
    repository: insighthub/api
    tag: kind
    pullPolicy: IfNotPresent
  env: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

web:
  replicaCount: 1
  image:
    repository: insighthub/web
    tag: kind
    pullPolicy: IfNotPresent
  service:
    port: 3000
  env: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 512Mi
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
    targetCPUUtilizationPercentage: 70

migration:
  enabled: true
  image: pgvector/pgvector:0.8.2-pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
  backoffLimit: 4
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 999
    seccompProfile:
      type: RuntimeDefault

secretsStore:
  enabled: false
  provider: aws
  secretName: insighthub-runtime-secrets
  awsSecretName: ""
  awsRegion: ""
  keys:
    - DATABASE_URL
    - REDIS_URL
    - GEMINI_API_KEY
    - GEMINI_CHAT_MODEL
    - GEMINI_EMBEDDING_MODEL
    - ANTHROPIC_API_KEY
    - OPENAI_API_KEY
    - VOYAGE_API_KEY

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: insighthub.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

networkPolicy:
  enabled: true

nodeSelector: {}
tolerations: []
affinity: {}
